.st-bar{font-size:13px;color:var(--text2);padding:8px 16px;background:var(--surface2);border-radius:999px;border:1px solid var(--border);min-width:220px;text-align:center;}
.st-bar.active{color:var(--red);border-color:var(--red-bd);background:var(--red-bg);}
.ta-wrap{margin-bottom:1rem;}

textarea{width:100%;min-height:90px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:15px;font-family:'Noto Sans KR',sans-serif;color:var(--text);line-height:1.65;resize:vertical;}
textarea:focus{outline:none;border-color:var(--border2);}
textarea::placeholder{color:var(--text3);}
.btn-ask{width:100%;padding:14px;background:var(--text);border:none;border-radius:var(--r);font-size:15px;font-weight:600;font-family:'Noto Sans KR',sans-serif;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s;-webkit-tap-highlight-color:transparent;margin-bottom:.75rem;}
.btn-ask:hover{opacity:.85;}.btn-ask:active{opacity:.7;}
.btn-row2{display:flex;gap:8px;margin-bottom:1rem;}
.btn-sm{flex:1;padding:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.btn-sm:hover{background:var(--surface2);}
.loader{display:none;align-items:center;gap:10px;font-size:13px;color:var(--text2);padding:8px 0 4px;justify-content:center;}

.dot{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.15s;}.dot:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.result-card{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;margin-top:1rem;box-shadow:var(--sh);}

.chat-a-label{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}

  #printFrame .pf-a-label{font-size:10pt;font-weight:600;color:#333;margin-bottom:6pt;}
  #printFrame .pf-a{font-size:15pt;line-height:1.75;white-space:pre-wrap;color:#000;}

<div class="wrap">
  <div class="hdr"><h1>🎙️ 아버지 헬퍼</h1></div>

        <div class="mic-icon">🎤</div>
        <span class="mic-lbl" id="micLbl">누르고 말하기</span>
      </button>
      <div class="st-bar" id="stBar">버튼을 누르고 말씀해 주세요</div>
    </div>
  </div>

  <div class="ta-wrap">
    <div class="ta-label">인식된 내용 (수정 가능)</div>
    <textarea id="taMain" placeholder="말씀하시면 여기에 내용이 나타납니다."></textarea>
  </div>

  <button class="btn-ask" onclick="sendMain()"><span>✉️</span> 비서에게 물어보기</button>

  <div class="loader" id="ldMain"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>답변 생성 중...</span></div>

  <div id="chatLog"></div>

  <div style="margin-top:1.5rem;">
    <div class="photo-card">
      <div class="ta-label" style="margin-bottom:10px;">📷 사진으로 글씨 인식</div>
      <p style="font-size:13px;color:var(--text2);margin-bottom:1rem;">A4 종이에 쓴 글씨를 핸드폰으로 찍어 올리면 자동으로 텍스트로 변환합니다.</p>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📄</div>
        <p>사진을 눌러 선택하세요</p>
        <p class="sub">핸드폰 카메라 또는 갤러리에서 선택 가능</p>
      </div>
      <img class="preview-img" id="previewImg" alt="업로드 사진">
      <div id="photoActions" style="display:none;">
        <div class="loader" id="ldPhoto" style="margin-bottom:.5rem;"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span>사진 분석 중...</span></div>
        <div class="result-card" id="resPhoto" style="margin-top:0;display:none;">
          <div class="result-label">추출된 텍스트</div>
          <div class="result-text" id="rbPhoto"></div>
          <button class="btn-copy" onclick="copyRes('rbPhoto',this)">📋 텍스트 복사</button>
        </div>
        <div style="margin-top:.75rem;"><button class="btn-sm" style="width:100%;" onclick="clearPhoto()">🔄 다른 사진 올리기</button></div>
      </div>
    </div>
    <div class="warn">⚖️ <span>법률 관련 답변은 <strong>참고용</strong>입니다. 중요한 결정은 반드시 변호사와 상담하세요.</span></div>
  </div>
</div>

- 감정인 김한승이 이 사건 북쪽 부지에 대한 토양오염 조사 실시.
- 주요 감정 결과:
  · TPH 최대농도: 46,271mg/kg (기준 800mg/kg 대비 약 58배 초과)
  · 오염 면적: 61.2㎡ / 오염 토량: 121.0㎥
  · 오염 부위: 이 사건 북쪽 부지 남동쪽 구석 상부 토양이 가장 심함
  · 오염시기: 적어도 10여 년 이상 이전에 시작
  · 오염물질: 중질유(차량정비업 운영 시 배출되는 윤활유를 비롯한 차량정비용 유류)
  · 오염원인 추정:
    (i) 문영국 소유 이 사건 인접 토지(동쪽)에서 유류 유출 후 확산, 또는
    (ii) 원고 소유 이 사건 남쪽 부지(남쪽)에서 유류 유출 후 확산
  · 오염기여도 추정: 문영국 인접 토지 차량정비업 60% : 남쪽 부지 차량정비업 40%

    - 토양정화공사 비용: 127,504,000원
    - 정화완료검증 비용: 32,524,060원

[원고 주요 주장]
================================================================

1. 토양오염 책임
   - 피고 문영국, 김광영, 박봉규(이하 '피고 등')는 각자 이 사건 북쪽 부지에
     인접한 토지에서 차량정비업을 영위함으로써 이 사건 북쪽 부지의 토양을 오염.
   - 그로 인하여 원고가 토양오염정밀조사 용역비, 오염토양정화 용역비,
     정화검증 용역비를 지출하는 손해를 입음.

2. 손해배상 청구 근거
   - 토양환경보전법 제10조의3에 따른 손해배상 의무.
   - 피고 등이 연대하여 총 정화비용 201,476,260원 배상할 것을 청구.

3. 피고 문영국의 증거인멸 및 토지훼손 행위 (호소문 내용)
   - 소송 계속 중 피고 문영국이 이 사건 토지에 무단으로 침입하여 증거 인멸.
   - 인접 건물 지붕 빗물과 485-6번지 지붕 빗물이 오염이 가장 심한 지역으로
     흘러들어가도록 물꼬랑을 내고, 통나무를 버섯 재배지처럼 쌓아 지속적으로
     물을 뿌려 오염 농도를 희석하려 시도.
   - 오염된 토양의 경계 부위를 시멘트로 덮어 은폐.
   - 60~70cm 깊이로 오염된 토양을 중장비를 동원하여 무단으로 파내어 반출
     (소송의 핵심 증거인 오염토 자체를 물리적으로 없애려는 악의적 시도).
   - 이미 2001년경 원고로부터 전세보증금을 반환받았음에도 불구하고,
     토양오염 문제가 불거지자 이를 반환받지 못했다며 반소(임대차보증금반환)
     및 행정소송 등을 제기하여 소송을 의도적으로 지연.
   - 이 사건 소송에서는 오염책임이 본인에게 없다고 주장하면서, 모순되게
     여수시를 상대로 토지정화명령을 피고 본인에게 내려달라는 행정소송 제기
     (자신이 정화책임자임을 스스로 인정하는 행동으로 원고는 해석).

4. 원고(정상문)의 타이어 사업과 이 사건 토지 무관 주장
   - 원고가 운영했던 금호타이어 사업장은 '여수시 연등동 731-3'에 위치.
   - 이 사건 토지는 '여수시 둔덕동' 소재로, 두 장소는 지리적으로 수 km 이격.
   - 피고가 오염원으로 지목하는 '동호타이어'는 '여수시 미평동 532-7번지'에서
     영업 중인 전혀 다른 사업체.
   - 원고는 1990년 직장 생활 시작 후 연등동 사업장을 정리하였으며,
     이 사건 토지 위에는 잔무처리용 컨테이너 1동을 약 5~6개월간 임시 설치한
     것에 불과하고 (수도시설도 없는 임시 사무공간), 오염을 유발할 어떠한
     영업활동도 하지 않음.
   - 증거: 리젠트화재보험 경력증명서(1990.2.1.~2001.1.31. 재직),
           금호타이어 폐업사실증명서(1988.12.01.개업, 1992.12.31.폐업),
           연등동 731-3번지 부가세 영수증(1989-90년),
           연등동 타이어 사업장 부동산 임대차 사실확인서
           (임대인 김용덕이 1988년~1991년 12월경까지 정상문에게
            금호타이어 대리점 사업장으로 임대한 사실 확인, 2026년 2월 21일 작성).

[피고 주요 반박]
================================================================

■ 피고 문영국의 주장 (2023가단62004)
1. 이 사건 북쪽 부지는 사무실, 다용도실, 주차장 등으로만 사용했을 뿐.
2. 차량정비업을 영위하면서 발생한 폐유는 폐기물업체에서 수거하여 가져갔음.
3. 이 사건 북쪽 부지에 콘크리트 포장을 하여 사용하였으므로 폐유가 스며들 수 없음.
4. 토양오염의 원인은 원고와 김광영, 박봉규 등 주변 토지 사용자들의 행위에 있음.
5. 증거: '사업장폐기물 관리대장'(을 제2호증) 제출 - 그러나 2018년 이후 기간분만
         기재되어 있어 이전 기간의 폐유 처리를 입증하기 부족.
6. 반소: 임대차보증금 반환 및 토지 정화공사비용 일부 구상금 청구 → 변론종결 전
         반소 전부 취하.
7. 행정소송: 여수시를 상대로 토지정화명령을 피고 본인에게 내려달라는 행정소송 제기.

■ 피고 김광영의 주장 (2025가단4471)
1. 차량정비 및 세차업은 약 2년 정도만 운영하였으며, 나머지 임대기간은 사업부진으로
   사업을 제대로 영위할 수 없었음.
2. 이 사건 토양오염에 대한 손해배상책임 부담 불가.
3. 소멸시효 항변: 이 사건 남쪽 부지에서 차량정비 및 세차업을 하지 않은 시점이
   1995년경으로 현 시점에서 30년 경과, 원고에게 부지 인도 시점이 2003. 7.경으로
   22년 경과 → 불법행위 있는 날로부터 10년 이상 경과하여 소멸시효 완성 주장.
   ※ 법원 판단: 소멸시효 기산점은 가해행위일이 아니라 손해 결과가 현실적으로
     발생된 날. 원고의 정화비용 지출이라는 손해가 현실화된 시점은 적어도
     2023. 6.경 토양오염조사 실시 이후이므로, 소제기일인 2025. 3. 20. 기준
     10년 미경과 → 소멸시효 항변 기각.
4. 피고 박봉규 및 문영국을 오염행위자로 지목.

■ 피고 박봉규의 주장 (2025가단4471)
1. 2014. 10.경 이후에만 소형차 경정비업을 추가하여 영위했을 뿐.
2. 오일드레인 등을 사용하여 폐유 유출 방지 조치를 취함.
3. 이 사건 남쪽 부지를 콘크리트로 견고하게 포장한 다음 사용.
4. 사업장폐기물 관리대장(을나 제7호증) 제출 → 2021년 이후 내역만 확인 가능.
5. 피고 김광영 및 문영국을 오염행위자로 지목.

■ 피고들 공통 주장 (2025가단4471)
- 관련 사건 감정인 김한승의 감정결과가 이 사건 남쪽 부지 및 인접 토지에 대한
  토양오염조사를 포함하고 있지 아니하여 신뢰성에 문제가 있음.
- 추가 토양오염조사를 실시해도 오래 전 발생한 오염의 원인을 사후적으로
  판단하는 것은 매우 의문임.

1. 피고(문영국)는 김광영, 박봉규와 연대하여 원고에게

2. 원고의 나머지 청구를 기각한다.
3. 소송비용의 3/10은 원고가, 7/10은 피고가 각 부담한다.
4. 제1항은 가집행할 수 있다.

■ 판결 이유 요약:

[손해배상책임 발생 인정]
법원은 다음 사정을 종합하여 이 사건 북쪽 부지의 토양오염이 피고 등의
각 영업활동으로 인하여 발생한 것으로 판단:
① 오염물질이 차량정비소에서 사용되는 윤활유, 폐유 등의 중질유.
② 토양오염이 적어도 10년 이상 이전부터 지속적으로 진행.
③ 오염 시작 위치로 추정된 토지들(인접 토지, 남쪽 부지)은 모두 피고 등이
   장기간 차량(경)정비업을 영위한 곳.
④ 피고 등이 폐유를 오염원이 되지 않도록 적절히 처리하였음을 인정할 만한
   구체적·객관적 자료 없음.
⑤ 피고 등의 영업 행위 외에 별도의 오염원인을 상정하기 어려움.
⑥ 원고가 이 사건 남쪽 부지에서 운영한 영업은 타이어 판매업으로서
   윤활유, 폐유 유출이 발생할 것으로 보이지 않음.

[연대책임 인정]
토양오염이 언제 시작되어 어느 정도 지속되었는지 파악 불가능하고,
오염물질이 유출된 양으로 추산하는 것도 불가능한 점을 감안,
토양환경보전법 제10조의3 제2항 소정의 '어느 자에 의하여 피해가 발생한
것인지를 알 수 없을 때'에 해당 → 피고 등 연대 배상 의무 인정.

[책임제한: 30% 감액]
법원은 다음 사정을 고려하여 피고 등의 책임을 70%로 제한:
① 오염물질 유출이 시작된 때로부터 상당한 시간 경과로 오염 발생원인 전부
   추적 불가능하거나 현저히 곤란 → 오염 발생원인이 전적으로 피고 등에게
   있다고 단정하기 어려운 점.
② 피고 등이 부주의로 인해 토양오염을 발생시킨 것으로 보이기는 하나,
   폐기물 처리에 대한 일정 정도의 노력을 기울인 것으로 보이는 점.
③ 원고는 이 사건 토지를 피고 등에게 오랜 기간 임대하면서,
   김광영이 임대기간을 종료한 2003년경을 포함하여 상당한 기간이 경과할
   때까지 토양오염 상태를 확인하고 방지하기 위한 별다른 조치를 취하지
   않은 채 방치 → 오염물질의 확산에 어느 정도 영향을 미친 것으로 보이는 점.

[산정 내역]
- 총 손해액: 201,476,260원
- 책임제한 비율: 70%
- 최종 인용액: 201,476,260원 × 70% = 141,033,382원

[청구취지 대비 인용/기각 내역]
- 원고 청구취지: 201,476,260원 + 지연손해금
- 법원 인용: 141,033,382원 + 지연손해금 (인용 비율 약 70%)
- 법원 기각: 60,442,878원 (30% 해당분)


================================================================
[1심 판결의 문제점 / 항소 근거]
================================================================

1. [책임제한 30%의 부당성]
   법원이 원고의 책임으로 귀속시킨 "오염 방지 조치를 취하지 않은 채 방치"
   부분은 토지 소유자인 원고가 임차인의 영업에 개입할 법적 의무가 없는 상황에서
   지나치게 가혹한 판단.
   - 토지 임대인이 임차인의 영업 과정에서 발생하는 폐유 처리를 감시·감독할
     법적 의무는 없음.
   - 토양오염의 원인 제공자는 전적으로 피고 등이며, 원고의 방치는 피고 등의
     오염 행위와 인과관계가 없거나 매우 미약함.
   - 감정 결과 오염기여도 자체를 60%(인접 토지) : 40%(남쪽 부지)로 추정하였는데,
     이를 근거로 한다면 문영국의 책임이 더 크고, 남쪽 부지 임차인들(김광영, 박봉규)의
     책임은 상대적으로 작을 수 있음. 법원이 이를 고려하지 않고 일률적으로
     30% 감액한 것은 재고 필요.

2. [이 사건 남쪽 부지 감정 미실시의 문제]
   감정인 김한승은 이 사건 인접 토지 및 이 사건 남쪽 부지에 대한 별도 토양오염도
   조사가 필요하다고 명시하였음에도, 이 사건 북쪽 부지만을 대상으로 한 감정 결과만으로
   오염기여도를 '추정'하였음.
   - 오염기여도의 정확한 판단을 위한 추가 감정이 이루어지지 않은 상태에서
     판결이 선고된 것은 증거 조사 미비의 문제가 있음.
   - 항소심에서 남쪽 부지 및 인접 토지에 대한 추가 감정을 신청하여 보다 정확한
     오염기여도를 입증할 필요가 있음.

3. [피고 문영국의 증거인멸 행위에 대한 판결의 불충분한 고려]
   - 피고 문영국이 소송 계속 중 오염토를 60~70cm 깊이로 무단 반출하고,
     물을 뿌려 오염 농도를 희석하려 시도하는 등 적극적인 증거인멸 행위를 자행.
   - 이러한 행위가 불법행위(증거인멸, 토지 무단 훼손)로서 추가 손해배상의 원인이
     될 수 있음에도, 판결에서 이에 대한 별도 손해배상은 인정되지 않음.
   - 피고 문영국의 반소(임대차보증금 반환) 및 허위 주장(보증금 미반환 주장)에 대해
     원고가 입금 영수증으로 허위임을 입증하였으나, 이에 대한 적극적인 제재가 없었음.

4. [피고 문영국의 자기모순 행위]
   - 피고 문영국은 이 사건 소송에서 오염책임이 본인에게 없다고 주장하면서,
     동시에 여수시를 상대로 토지정화명령을 피고 본인에게 내려달라는 행정소송 제기.
   - 이는 피고 문영국 스스로가 정화책임자임을 인정하는 것으로,
     항소심에서 이러한 자기모순을 적극 강조할 필요가 있음.

5. [원고 타이어 사업과 이 사건 토지의 무관함]
   - 피고 문영국은 원고가 과거 '동호타이어'라는 상호로 이 사건 토지에서
     타이어 사업을 운영하여 오염이 발생하였다고 주장.
   - 그러나 원고의 금호타이어 사업장은 연등동 731-3번지이고,
     이 사건 토지는 둔덕동으로 수 km 이격된 전혀 다른 장소.
   - 관련 증거(경력증명서, 폐업사실증명서, 부가세 영수증, 임대차 사실확인서)가
     명확히 이를 입증하고 있음에도 판결이 이 부분을 명확히 정리하지 않은 점이
     항소심에서 재확인 필요.

6. [김광영의 실제 영업기간 문제]
   - 김광영은 임대기간(1993~2003) 중 실제로는 약 2년 정도만 운영하였다고 주장.
   - 그러나 법원은 영업기간 전체를 오염 기여 기간으로 인정.
   - 항소심에서 피고 각자의 실제 영업기간과 규모를 더 구체적으로 주장하여
     개별 책임 비율을 다툴 여지가 있음.


================================================================
[항소심 전략 포인트]
================================================================

1. [책임제한 비율 상향 주장]
   - 현재 70% 책임 인정 → 항소심에서 100% 전액 배상 주장.
   - 원고의 방치가 오염 확산에 기여했다는 판단의 부당성 강조:
     임대인에게는 임차인의 영업 과정 감시 의무가 없음.
   - 대법원 판례상 과실상계에서 피해자의 기여분이 인정되려면 피해자에게
     주의의무 위반이 있어야 하는데, 원고에게 그러한 주의의무가 있는지 검토.

2. [추가 감정 신청]
   - 이 사건 남쪽 부지(박봉규 운영 구역) 및 문영국 인접 토지에 대한
     별도 토양오염도 조사 감정 신청.
   - 오염기여도를 보다 정확히 산정하여 피고 각자의 책임 범위 명확화.
   - 특히 감정인이 6:4(인접 토지:남쪽 부지)로 추정한 기여도를 근거로,
     문영국의 책임이 더 크고 원고의 책임은 없음을 강조.

3. [피고 문영국의 증거인멸 및 추가 불법행위에 대한 별도 청구 검토]
   - 소송 계속 중 오염토 무단 반출, 토지 무단 훼손에 대한 불법행위 손해배상 청구.
   - 원상회복이 완료될 때까지의 임료 상당 부당이득반환 청구 가능성 검토.

4. [자기모순 행위 강조]
   - 피고 문영국이 민사소송에서는 책임을 부인하면서 행정소송에서는 스스로
     정화책임자임을 주장하는 자기모순적 소송 행태를 항소심에서 적극 부각.

5. [소송비용 분담 문제]
   - 현재 소송비용의 30%를 원고가 부담하도록 판결.
   - 항소심에서 원고의 책임 비율이 상향되면 소송비용도 재산정 가능.

6. [피고 김광영의 소멸시효 항변 재검토]
   - 1심에서 소멸시효 항변은 기각되었으나, 항소심에서 피고가 재다툴 가능성.
   - '손해가 현실적으로 발생된 날'은 2023. 6.경 토양오염조사 실시 이후임을
     재확인하여 소멸시효 항변을 재차 방어.

7. [가집행 선고 활용]
   - 1심 판결에 가집행 선고가 있으므로, 항소심 계속 중에도 가집행을 통한
     일부 채권 회수 가능성 검토.

8. [일실수익 손해 별도 청구 검토]
   - 피고 문영국이 토지의 형질을 변경하고 원상회복을 거부하여 원고가
     새로운 임대를 못하는 손해를 지속적으로 입고 있음.
   - 원고 호소문에서 "이 사건 판결 선고 이후 정리하여 별도의 소제기도
     검토"하고 있다고 언급. 임료 상당 일실수익 청구를 별도 소로 제기하거나
     항소심에서 청구취지 변경 검토.


================================================================
[관련 법령]
================================================================

1. 토양환경보전법 제10조의3 (토양오염 피해에 대한 무과실책임)
   ① 토양오염으로 인하여 피해가 발생한 경우 그 오염을 발생시킨 자는
      그 피해를 배상하고 오염된 토양을 정화하는 등의 조치를 하여야 한다.
      다만, 토양오염이 천재지변이나 전쟁, 그 밖의 불가항력으로 인하여
      발생하였을 때에는 그러하지 아니하다.
   ② 토양오염을 발생시킨 자가 둘 이상인 경우에 어느 자에 의하여 제1항의
      피해가 발생한 것인지를 알 수 없을 때에는 각자가 연대하여 배상하고
      오염된 토양을 정화하는 등의 조치를 하여야 한다.
   ※ 이 사건에서 연대책임의 법적 근거 조항.

2. 민법 제750조 (불법행위 일반)
   - 고의 또는 과실로 인한 위법행위로 타인에게 손해를 가한 자는
     그 손해를 배상할 책임이 있다.

3. 민법 제760조 (공동불법행위)
   - 수인이 공동의 불법행위로 타인에게 손해를 가한 때에는 연대하여
     그 손해를 배상할 책임이 있다.

4. 민법 제766조 (손해배상청구권의 소멸시효)
   ① 불법행위로 인한 손해배상의 청구권은 피해자나 그 법정대리인이
      그 손해 및 가해자를 안 날로부터 3년간 이를 행사하지 아니하면
      시효로 인하여 소멸한다.
   ② 불법행위를 한 날로부터 10년을 경과한 때에도 전항과 같다.
   ※ '불법행위를 한 날' = 가해행위일이 아니라 손해 결과가 현실적으로
     발생된 날(대법원 2005. 5. 13. 선고 2004다71881 판결,
     대법원 2016. 5. 19. 선고 2009다66549 전원합의체 판결).

5. 소송촉진 등에 관한 특례법 (소촉법)
   - 판결 선고일 다음날부터 연 12%의 지연손해금 적용.

6. 관련 대법원 판례
   - 대법원 2006. 5. 19. 선고 2009다66549 판결 (전원합의체)
     : 토양오염을 유발한 자의 손해배상책임 - 관할 행정관청으로부터
       조치명령 등을 받아 오염토양 정화비용을 지출해야만 하는 상황에
       이르렀다면, 그 비용 상당의 손해에 대하여 불법행위자로서
       손해배상책임을 진다.
   - 대법원 2005. 5. 13. 선고 2004다71881 판결
     : 오염토양 정화비용 지출이라는 손해의 현실적 발생 시점.
   - 대법원 2007. 2. 22. 선고 2004다70420, 70437 판결
     : 감정방법이 경험칙에 반하거나 합리성이 없는 등의 현저한 잘못이
       없는 한 감정 결과를 존중하여야 함.

[기타 참고 사항]

  · 여수시 둔덕동 485-4 토지
  · 여수시 둔덕동 485-10 토지
  · 문영국이 영진부분정비공업사, 영진세차장을 운영.

- 원고의 구(舊) 타이어 사업장 (이 사건과 무관):
  · 여수시 연등동 731-3번지 (479.4㎡ 중 공유지분 2분의 1)
  · 금호타이어 대리점, 1988.12.01.~1992.12.31. 운영 후 폐업
  · 임대인: 김용덕 (여수시 공화동 1222-1 소유자)`;
var SYSTEM='당신은 정상문 씨의 실질적인 법률 비서입니다. 항상 한국어로 답변합니다.\n\n'
  +'[답변 원칙]\n'
  +'- 두루뭉술하게 말하지 마세요. 구체적으로 "이렇게 하세요", "이 서류를 내세요", "이 조항을 근거로 주장하세요"처럼 직접적으로 안내하세요.\n'
  +'- 확실한 사실은 단정적으로 말하고, 확인이 필요한 부분은 반드시 "(확인 필요: ...)" 또는 "이 부분은 변호사에게 직접 확인하세요"라고 명시하세요.\n'
  +'- 거짓이나 추측을 사실처럼 말하지 마세요. 모르는 것은 모른다고 하세요.\n'
  +'- "~할 수 있습니다", "~일 수도 있습니다" 같은 불필요한 애매한 표현을 피하세요. 근거가 있으면 명확하게 말하세요.\n'
  +'- 법적 조언이 유효하려면 사실관계 확인이 필요한 경우, 어떤 정보를 추가로 확인해야 하는지 구체적으로 명시하세요.\n\n'
  +'[형식 규칙]\n'
  +'- 답변에서 #, ##, **, *, 불릿(•) 등 마크다운 기호를 절대 사용하지 마세요. 순수 텍스트로만 작성하세요.\n'
  +'- 항목을 나열할 때는 1. 2. 3. 또는 가. 나. 다. 형식을 사용하세요.\n'
  +'- 편지·서신·내용증명·법률 문서 작성 요청 시: 문서 본문만 작성하세요. 앞뒤로 설명, 안내 문구(예: "이렇게 보내시면 됩니다", "다음과 같이 작성했습니다" 등)를 절대 추가하지 마세요. 복사하면 바로 편지가 되어야 합니다.\n\n'
  +'소송 자료가 제공된 경우 반드시 해당 자료의 사실관계를 바탕으로 답변하고, 자료에 없는 내용은 없다고 밝히세요.';

var recog=null, isRec=false, photoB64=null, finalTranscript='';
var chatHistory=[];

function loadHistory(){
  try{var s=localStorage.getItem('dad_chat');if(s)chatHistory=JSON.parse(s);}
  catch(e){chatHistory=[];}
  renderHistory();
}

function saveHistory(){
  try{localStorage.setItem('dad_chat',JSON.stringify(chatHistory));}catch(e){}
}

function timeStr(){
  var d=new Date();
  return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderHistory(){
  var log=document.getElementById('chatLog');
  if(!chatHistory.length){log.innerHTML='';return;}
  var html='<div class="chat-log">';
  for(var i=0;i<chatHistory.length;i++){
    var item=chatHistory[i];
    if(item.role==='user'){
      html+='<div class="chat-q-wrap"><div class="chat-q-label">나 · '+escHtml(item.time)+'</div>'
           +'<div class="chat-q">'+escHtml(item.text)+'</div></div>';
    } else {
      var safeText=item.text.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
      html+='<div class="chat-a"><div class="chat-a-label">비서 답변 · '+escHtml(item.time)+'</div>'
           +'<div class="chat-a-text">'+escHtml(item.text)+'</div>'
           +'<div class="btn-pair">'
           +'<button class="btn-copy" onclick="copyChat(this,\''+safeText+'\')">📋 복사하기</button>'
           +'<button class="btn-print-single" onclick="printSingle('+i+')">🖨️ 인쇄하기</button>'
           +'</div></div>';
    }
  }
  html+='</div>';
  log.innerHTML=html;
}

function printSingle(idx){
  var asst=chatHistory[idx];
  var user=null;
  for(var i=idx-1;i>=0;i--){if(chatHistory[i].role==='user'){user=chatHistory[i];break;}}
  var frame=document.getElementById('printFrame');
  var html='';
  if(user){
    html+='<div class="pf-q-label">질문 · '+escHtml(user.time)+'</div>';
    html+='<div class="pf-q">'+escHtml(user.text)+'</div>';
    html+='<div class="pf-divider"></div>';
  }
  html+='<div class="pf-a-label">답변 · '+escHtml(asst.time)+'</div>';
  html+='<div class="pf-a">'+escHtml(asst.text)+'</div>';
  frame.innerHTML=html;
  window.print();
}

function copyChat(btn,text){
  var decoded=text.replace(/\\n/g,'\n').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
  if(navigator.clipboard){
    navigator.clipboard.writeText(decoded).then(function(){
      var o=btn.textContent;btn.textContent='✅ 복사 완료!';setTimeout(function(){btn.textContent=o;},2000);
    });
  } else {
    var ta=document.createElement('textarea');ta.value=decoded;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    var o=btn.textContent;btn.textContent='✅ 복사 완료!';setTimeout(function(){btn.textContent=o;},2000);
  }
}

function clearHistory(){
  if(!confirm('대화내역을 전부 삭제할까요?'))return;
  chatHistory=[];saveHistory();renderHistory();
}

function clearInput(){
  document.getElementById('taMain').value='';
  setSt('버튼을 누르고 말씀해 주세요',false);
}

function initSpeech(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){document.getElementById('notSup').style.display='block';return false;}
  recog=new SR();
  recog.lang='ko-KR';
  recog.continuous=true;
  recog.interimResults=true;
  recog.onresult=function(e){
    var intr='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalTranscript+=e.results[i][0].transcript;
      else intr+=e.results[i][0].transcript;
    }
    document.getElementById('taMain').value=finalTranscript+intr;
    setSt('🎤 인식 중...',true);
  };
  recog.onerror=function(e){
    if(e.error==='no-speech'){setSt('🔴 듣고 있습니다...',true);return;}
    if(e.error==='not-allowed'){setSt('마이크 권한을 허용해 주세요.',false);stopRec();return;}
    setSt('음성오류: '+e.error,false);stopRec();
  };
  recog.onend=function(){
    if(isRec){
      isRec=false;
      document.getElementById('micBtn').classList.remove('rec');
      document.getElementById('micLbl').textContent='누르고 말하기';
      setSt('🎤 끊겼습니다. 버튼을 다시 눌러주세요.',false);
    }
  };
  return true;
}

function toggleRec(){
  if(isRec){stopRec();return;}
  finalTranscript=document.getElementById('taMain').value;
  if(!recog&&!initSpeech())return;
  try{recog.start();}catch(x){recog=null;if(!initSpeech())return;recog.start();}
  isRec=true;
  document.getElementById('micBtn').classList.add('rec');
  document.getElementById('micLbl').textContent='멈추기';
  setSt('🔴 듣고 있습니다...',true);
}

function stopRec(){
  isRec=false;finalTranscript='';
  if(recog)try{recog.stop();}catch(x){}
  document.getElementById('micBtn').classList.remove('rec');
  document.getElementById('micLbl').textContent='누르고 말하기';
  var txt=document.getElementById('taMain').value.trim();
  setSt(txt?'✅ 인식 완료. 아래 버튼을 눌러주세요.':'버튼을 누르고 말씀해 주세요',false);
}

function setSt(msg,active){
  var el=document.getElementById('stBar');
  el.textContent=msg;
  el.className='st-bar'+(active?' active':'');
}

function callClaude(messages,system,cb){
  var body={model:'claude-sonnet-4-5',max_tokens:2000,messages:messages};
  if(system)body.system=system;
  fetch(APIURL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){return r.text();}).then(function(t){
    if(!t)throw new Error('응답이 없습니다.');
    var d=JSON.parse(t);
    if(d.error)throw new Error(d.error.message);
    cb(null,d.content[0].text);
  }).catch(function(e){cb(e.message,null);});
}

function sendMain(){
  var text=document.getElementById('taMain').value.trim();
  if(!text){setSt('⚠️ 내용을 입력하거나 말씀해 주세요.',false);return;}
  if(isRec)stopRec();
  var t=timeStr();
  chatHistory.push({role:'user',text:text,time:t});
  saveHistory();renderHistory();
  document.getElementById('taMain').value='';
  finalTranscript='';
  setSt('답변 생성 중...',true);
  showLoader('ldMain',true);
  var sys=SYSTEM+(CASE_CONTEXT?'\n\n[소송 자료]\n'+CASE_CONTEXT:'');
  callClaude([{role:'user',content:text}],sys,function(err,result){
    showLoader('ldMain',false);
    chatHistory.push({role:'assistant',text:err?'오류: '+err:result,time:t});
    saveHistory();renderHistory();
    setSt('✅ 답변 완료. 아래를 확인하세요.',false);
    window.scrollTo(0,document.body.scrollHeight);
  });
}

function compressPhoto(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    var MAX=1568,w=img.width,h=img.height;
    if(w>MAX||h>MAX){if(w>=h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
    var c=document.createElement('canvas');
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.85));
  };
  img.src=dataUrl;
}

function handlePhoto(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    compressPhoto(e.target.result,function(compressed){
      photoB64=compressed;
      document.getElementById('previewImg').src=photoB64;
      document.getElementById('previewImg').style.display='block';
      document.getElementById('uploadZone').style.display='none';
      document.getElementById('photoActions').style.display='block';
      document.getElementById('resPhoto').style.display='none';
      autoExtract();
    });
  };
  reader.readAsDataURL(file);
}

function autoExtract(){
  showLoader('ldPhoto',true);
  document.getElementById('resPhoto').style.display='none';
  var b64=photoB64.split(',')[1];
  var mt=photoB64.match(/data:(image[^;]+);/);
  callClaude([{role:'user',content:[
    {type:'image',source:{type:'base64',media_type:mt?mt[1]:'image/jpeg',data:b64}},
    {type:'text',text:'이 이미지에서 손으로 쓴 글씨나 인쇄된 텍스트를 빠짐없이 정확하게 읽어서 텍스트로만 변환해주세요. 설명 없이 텍스트 내용만 출력하세요.'}
  ]}],null,function(err,result){
    document.getElementById('rbPhoto').textContent=err?'오류: '+err:result;
    document.getElementById('resPhoto').style.display='block';
    showLoader('ldPhoto',false);
  });
}

function clearPhoto(){
  photoB64=null;
  document.getElementById('previewImg').style.display='none';
  document.getElementById('previewImg').src='';
  document.getElementById('uploadZone').style.display='block';
  document.getElementById('photoActions').style.display='none';
  document.getElementById('photoInput').value='';
}

function copyRes(id,btn){
  var text=document.getElementById(id).textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      var o=btn.textContent;btn.textContent='✅ 복사 완료!';setTimeout(function(){btn.textContent=o;},2000);
    });
  } else {
    var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    var o=btn.textContent;btn.textContent='✅ 복사 완료!';setTimeout(function(){btn.textContent=o;},2000);
  }
}

function showLoader(id,show){document.getElementById(id).className='loader'+(show?' on':'');}

document.addEventListener('DOMContentLoaded',function(){
  loadHistory();
  var uz=document.getElementById('uploadZone');
  var pi=document.getElementById('photoInput');
  uz.addEventListener('click',function(){pi.click();});
  pi.addEventListener('change',function(){if(pi.files&&pi.files[0])handlePhoto(pi.files[0]);});
  uz.addEventListener('dragover',function(e){e.preventDefault();uz.classList.add('drag');});
  uz.addEventListener('dragleave',function(){uz.classList.remove('drag');});
  uz.addEventListener('drop',function(e){
    e.preventDefault();uz.classList.remove('drag');
    var f=e.dataTransfer.files[0];
    if(f&&f.type.indexOf('image')===0)handlePhoto(f);
  });
});
</script>
<div id="printFrame"></div>
</body>
